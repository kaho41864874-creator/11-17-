<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>迷路ゲーム</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="game">
      <h1>迷路ゲーム</h1>

      <div class="status-bar">
        <p>残り時間: <span id="timer">120</span>秒</p>
        <div class="game-buttons">
          <button id="start-button" type="button">ゲーム開始</button>
          <button id="restart-button" type="button">やり直す</button>
        </div>
      </div>

      <div class="bgm-controls" aria-label="BGMコントロール">
        <button id="bgm-toggle-button" type="button">BGMを停止</button>
        <label for="bgm-volume">
          音量
          <input
            id="bgm-volume"
            type="range"
            min="0"
            max="100"
            value="30"
          />
        </label>
      </div>

      <div
        id="maze"
        class="maze"
        role="application"
        aria-label="迷路ゲーム。矢印キーで移動してください"
      ></div>

      <div id="result" class="result" hidden>
        <div class="result-panel" role="dialog" aria-modal="true" aria-labelledby="result-title">
          <p id="result-title" class="result-title"></p>
          <button id="result-restart-button" type="button">もう一度プレイ</button>
        </div>
      </div>
    </main>

    <script src="script.js"></script>
  </body>
</html>
